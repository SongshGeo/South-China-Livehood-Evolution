[project]
name = "abses_sce"
version = "0.8.0"
description = "South China Livelihood Evolution Model - agent-based simulation of prehistoric livelihood change"
readme = "README.md"
authors = [{ name = "SongshGeo", email = "songshgeo@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "fiona>=1.9",
    # Pin below abses' upper bound; 0.9.3+ can interact badly with abses PatchModule init.
    "mesa-geo==0.9.2",
    "rasterio>=1.4.3",
    "rioxarray>=0.13.0",
    "urllib3<2.0",
    "seaborn",
    "ruptures>=1.1.9",
    "abses>=0.11.0",
    "shapely==2.0.4",
    "twist-academic>=0.3.0",
    "matplotkit>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-clarity>=1.0.1",
    "pytest-sugar>=0.9.7",
    "allure-pytest>=2.13.2",
    # Pinned to the exact revs in .pre-commit-config.yaml so that running these
    # locally and running them through pre-commit can never disagree.
    "black==25.9.0",
    "flake8==7.3.0",
    "isort==7.0.0",
    "pre-commit>=3.5",
    # Builds the manuscript table workbook (paper/figs/SCE_Tables.xlsx).
    "openpyxl>=3.1",
]
notebook = [
    "ipykernel>=6.25.1",
    "jupyterlab>=4.0.9",
    "jupyterlab-execute-time>=3.0.1",
    # Rebuilding the manuscript figures runs the notebook headlessly:
    #   uv run jupyter nbconvert --execute --to notebook --inplace \
    #       reports/manuscript_figures.ipynb
    # jupyterlab happens to pull nbconvert in today, but the figure workflow
    # depends on it directly, so declare it rather than rely on that.
    "nbconvert>=7.0",
]

# Only the packaging fields poetry-core needs; all metadata lives in [project] above.
[tool.poetry]
packages = [{ include = "src" }]
include = ["config/viz_config.yaml"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.scriv]
version = "literal: pyproject.toml: project.version"
format = "md"
